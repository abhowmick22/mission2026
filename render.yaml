services:
  - type: web
    name: world-order
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_app:app --bind 0.0.0.0:$PORT --workers 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
    disk:
      name: game-saves
      mountPath: /opt/render/project/src/saves
      sizeGB: 1
